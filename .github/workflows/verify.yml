name: Verify
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: docker compose config --quiet
      - run: docker build --target runtime -t prompt-off:ci .
      # Full database + browser rehearsal is explicitly opt-in until an isolated
      # fixture and protected file inputs are provisioned; see deploy/README.md.
